# Golden IR Corpus — gate-zero contract for the Ruby DSL → JSON IR compiler.
#
# Runs on every push and PR. Compiles every in-tree gen and pipeline in
# bare mode (ruby compile.rb <file>) and compares against committed JSON
# snapshots. A wording change in a pinned error message, or an IR field
# change in any gen, fails this workflow before it reaches review.
#
# Fully offline — no LLM provider, no secrets, no network. The tests
# only shell out to `ruby` (stdlib-only; CLAUDE.md dependency policy).
#
# Node setup mirrors ci-review.yml (Node 22, npm cache). Ruby setup also
# mirrors ci-review.yml: system Ruby from apt, avoiding ruby/setup-ruby@v1
# because Forgejo's action mirror tracks the upstream runs.using=node24
# bump while the Forgejo runner currently maxes out at node20 — the action
# setup would fail before any step runs. System Ruby from apt is sufficient
# since Cambium's Ruby surface is stdlib-only (json, digest).

name: Golden IR Corpus

on:
  # `push` only for main so post-merge/direct commits still get a run;
  # feature branches are covered once by `pull_request` (avoids the
  # duplicate push+PR run for a branch with an open PR).
  push:
    branches: [main]
  pull_request:

jobs:
  golden:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Ruby
        # Cambium's Ruby surface is stdlib-only (see CLAUDE.md
        # "Dependency policy") — no gems, so no ruby-dev / native-
        # extension toolchain is needed; plain `ruby` is enough and
        # skips a large recommends chain. We avoid ruby/setup-ruby@v1
        # because Forgejo's action mirror tracks upstream's runs.using
        # bump to node24, while the Forgejo runner currently maxes out
        # at node20 — the action setup fails before any step runs.
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ruby
          ruby --version

      # setup-node's `cache: 'npm'` only caches ~/.npm (the download
      # cache), not node_modules — `npm ci` still rebuilds it every run.
      # Cache node_modules keyed on the lockfile and skip install on a
      # hit. Safe because postinstall scripts are forbidden (CLAUDE.md),
      # so an exact-lockfile-match node_modules is fully deterministic.
      - name: Cache node_modules
        id: node-cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('**/package-lock.json') }}

      - name: Install dependencies
        if: steps.node-cache.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Run golden IR tests
        run: npm run test:golden
